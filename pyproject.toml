[project]
name = "taiga-mcp"
version = "0.1.0"
description = "MCP server (streamable HTTP) exposing Taiga user stories and tasks to household agents"
authors = [
    { name = "Edmund Hood Highcock", email = "edmundhighcock@users.sourceforge.net" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==1.30.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "starlette==1.10.0",
]

[project.scripts]
taiga-mcp = "taiga_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
